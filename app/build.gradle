plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.eyeturn'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.eyeturn'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // ponytail: 臉＋手關鍵點唯一外來依賴；Camera2 用內建，眨眼讀 blendshape、拳頭自寫幾何
    implementation 'com.google.mediapipe:tasks-vision:0.10.26.1'
}
